
name: Indian Stock Paper Trader

on:
  workflow_dispatch:
  schedule:
    # 17:45 India time, Monday to Friday
    - cron: "15 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: indian-stock-paper-trader
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run paper trader
        run: python main.py

      - name: Commit paper account state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json
          git diff --cached --quiet || git commit -m "Update paper trading state"
          git push

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indian-stock-paper-trader-reports
          path: output/
          if-no-files-found: warn
          retention-days: 30
